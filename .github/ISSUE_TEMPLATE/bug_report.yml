name: Bug report
description: Report a reproducible problem in PageWand
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include vulnerability details or sensitive page content. Use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: PageWand version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome and operating system
      placeholder: Chrome 151 on macOS 16
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Activation or toolbar, Zap, Edit, CSS, Capture, Download, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a public test page or a minimal HTML example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
